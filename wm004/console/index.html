<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta http-equiv="Cache-Control" content="no-store"><title>WM004 Rain Emergency Response</title>
<style>
:root{--ground:#0C1319;--panel:#121C24;--panel-2:#17232C;--line:#24333F;--ink:#E7EEF3;--ink-soft:#9EB0BF;--accent:#2FA3C0;--accent-wash:rgba(47,163,192,.14);--sans:Calibri,Carlito,"Segoe UI",sans-serif}
html,body{margin:0;height:100%;background:var(--ground);color:var(--ink);font-family:var(--sans)}
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px}
.g-box{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px 24px 22px;text-align:center}
h1{margin:0 0 4px;font-size:20px;font-weight:700}p{margin:0 0 16px;font-size:13.5px;color:var(--ink-soft)}
#gate-in{width:100%;box-sizing:border-box;font:inherit;font-size:20px;letter-spacing:.08em;text-align:center;padding:10px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);-webkit-text-security:disc}
#gate-in.shown{-webkit-text-security:none}
.shw{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--ink-soft);cursor:pointer;justify-content:center}.shw input{width:auto}
#gate-in:focus{outline:2px solid var(--accent);outline-offset:1px}
button{margin-top:12px;width:100%;font:inherit;font-size:14px;font-weight:700;padding:9px;border-radius:8px;cursor:pointer;border:1px solid var(--accent);background:var(--accent-wash);color:var(--ink)}
.g-msg{min-height:18px;margin:10px 0 0;font-size:13px}
.view{border:1px solid var(--line);border-radius:8px;margin:12px 0 0;padding:6px 8px 8px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.view legend{font-size:12px;color:var(--ink-soft);padding:0 6px}
.view label{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);padding:5px 12px;border:1px solid var(--line);border-radius:14px;cursor:pointer}
.view input{margin:0;accent-color:var(--accent)}
.view label:has(input:checked){background:var(--accent-wash);border-color:var(--accent)}
.bar{height:4px;background:var(--panel-2);border-radius:2px;margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
</style></head><body>
<div id="gate" role="dialog" aria-modal="true" aria-label="Access code"><form class="g-box" autocomplete="off">
<h1>WM004 Rain Emergency Response</h1><p>Enter the access code to open the console. It refreshes its weather feed every 15 minutes.</p>
<input id="gate-in" type="text" maxlength="96" aria-label="Access code" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
<label class="shw"><input type="checkbox" id="gate-show"> Show the code I type</label>
<fieldset class="view" aria-label="Open as"><legend>Open as</legend>
<label><input type="radio" name="gview" value="auto" checked> Auto</label><label><input type="radio" name="gview" value="desktop"> Desktop</label><label><input type="radio" name="gview" value="mobile"> Mobile</label></fieldset>
<button type="submit">Open</button><div class="g-msg" id="gate-msg" aria-live="polite"></div><div class="bar"><i id="gate-bar"></i></div></form></div>
<script>
(function(){
  var ROUNDS=1000000, APPROX=3844322;
  var form=document.querySelector("form"), inp=document.getElementById("gate-in"), msg=document.getElementById("gate-msg"), bar=document.getElementById("gate-bar");
  var busy=false, wait=0, tries=0;
  document.getElementById("gate-show").addEventListener("change",function(e){ inp.className=e.target.checked?"shown":""; });
  function fetchBin(name){
    return fetch(name,{cache:"no-store"}).then(function(r){
      if(!r.ok) throw new Error(name+" "+r.status);
      var total=+r.headers.get("content-length")||APPROX, got=0, reader=r.body.getReader(), parts=[];
      function pump(){ return reader.read().then(function(x){ if(x.done){ return; } parts.push(x.value); got+=x.value.length; bar.style.width=Math.min(70,Math.round(8+62*got/total))+"%"; return pump(); }); }
      return pump().then(function(){ var all=new Uint8Array(got), o=0; parts.forEach(function(p){ all.set(p,o); o+=p.length; }); return all; });
    });
  }
  function gunzip(buf){
    if(typeof DecompressionStream!=="function") throw new Error("This browser cannot open the console. Use Chrome, Edge or Safari 16.4 or newer.");
    var ds=new DecompressionStream("gzip"); var w=ds.writable.getWriter(); w.write(buf); w.close();
    return new Response(ds.readable).arrayBuffer();
  }
  /* The view: Auto (the page decides from the screen), Desktop (a desktop layout even on a phone), Mobile (the phone layout even on a wide screen, in a phone width frame).
     The choice comes from the address (?view=mobile or ?view=desktop, so a link can carry it), else from the buttons above, else from what this browser remembered (set only when a button is used). */
  var KEY="wm004_view", VIEWS={auto:1,desktop:1,mobile:1};
  function qView(){ var m=/[?&]view=(auto|desktop|mobile)/.exec(location.search); return m?m[1]:""; }
  function savedView(){ try{ var v=localStorage.getItem(KEY); return VIEWS[v]?v:""; }catch(e){ return ""; } }
  (function(){ var v=qView()||savedView(); if(v){ var r=document.querySelector('input[name=gview][value='+v+']'); if(r) r.checked=true; } })();
  function chosenView(){ var r=document.querySelector('input[name=gview]:checked'); var v=r?r.value:"auto"; if(!qView()){ try{ if(v==="auto") localStorage.removeItem(KEY); else localStorage.setItem(KEY,v); }catch(e){} } return qView()||v; }
  function openIn(html, view){
    var wide=window.innerWidth>760;
    if(view==="mobile" && wide){
      /* a phone width frame: the console runs inside it, so its own phone layout applies; a bar outside the frame switches back */
      /* inside the frame the page has no host name of its own (about:srcdoc), so the console would think it is not on the website and would not refresh: tell it it is live */
      var inner=html.split("/github\\.io$/.test(location.hostname)").join("true").replace("<head>","<head><script>window.__WM004_VIEW='mobile-inner';window.__WM004_LIVE=true;<\/script>");
      document.open();
      document.write('<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WM004 Rain Emergency Response</title><style>html,body{margin:0;height:100%;background:#0C1319;color:#E7EEF3;font-family:Calibri,Carlito,"Segoe UI",sans-serif}body{display:flex;flex-direction:column;align-items:center}.vbar{box-sizing:border-box;width:100%;display:flex;gap:10px;align-items:center;justify-content:center;padding:6px 12px;font-size:13px;color:#9EB0BF;border-bottom:1px solid #24333F}.vbar a{color:#E7EEF3;text-decoration:underline;cursor:pointer}.phone{flex:1;min-height:0;width:430px;max-width:100%;border-left:1px solid #24333F;border-right:1px solid #24333F;background:#fff}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><div class="vbar"><span>Mobile view</span><a id="vd">Desktop view</a><a id="va">Auto</a></div><div class="phone"><iframe id="vf" title="WM004 mobile view"></iframe></div></body></html>');
      document.close();
      function sw(v){ try{ if(v==="auto") localStorage.removeItem(KEY); else localStorage.setItem(KEY,v); }catch(e){} var u=location.pathname+(v==="auto"?"":"?view="+v); location.href=u; }
      document.getElementById("vd").onclick=function(){ sw("desktop"); };
      document.getElementById("va").onclick=function(){ sw("auto"); };
      document.getElementById("vf").srcdoc=inner;
      return;
    }
    if(view==="desktop" && !wide){
      /* a desktop layout on a narrow screen: ask the browser for a wide page and let it scale it down */
      html=html.replace(/<meta name="viewport"[^>]*>/i,'<meta name="viewport" content="width=1280">');
    }
    document.open(); document.write(html); document.close();
  }
  /* the key of the sealed NCM files, unwrapped with the same code. In memory only; a failure leaves the console on the public facts. */
  function unlockNcm(code){
    var s=crypto.subtle;window.__WM004_NCM_KEY=null;
    return fetch("../ncm/key.bin",{cache:"no-store"}).then(function(r){ if(!r.ok) throw new Error("no key"); return r.arrayBuffer(); }).then(function(b){
      var kb=new Uint8Array(b);
      return s.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]).then(function(km){
        return s.deriveKey({name:"PBKDF2",salt:kb.subarray(0,16),iterations:ROUNDS,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
      }).then(function(k){ return s.decrypt({name:"AES-GCM",iv:kb.subarray(16,28)},k,kb.subarray(28)); });
    }).then(function(der){ return s.importKey("pkcs8",der,{name:"ECDH",namedCurve:"P-256"},false,["deriveBits"]); }).then(function(key){ window.__WM004_NCM_KEY=key; }).catch(function(){ window.__WM004_NCM_KEY=null; });
  }
  form.addEventListener("submit",function(ev){
    ev.preventDefault();
    if(busy) return;
    if(Date.now()<wait){ msg.textContent="Wait a few seconds and try again."; return; }
    var v=(inp.value||"").replace(/\s+/g,"");
    if(!window.crypto||!crypto.subtle){ msg.textContent="This browser cannot check the access code. Use Chrome, Edge or Safari."; return; }
    busy=true; msg.textContent="Loading"; bar.style.width="5%";
    var ct=null;
    fetchBin("app.bin").then(function(bin){
      ct=bin; msg.textContent="Checking the code"; bar.style.width="72%";
      return crypto.subtle.importKey("raw",new TextEncoder().encode(v),"PBKDF2",false,["deriveKey"]);
    }).then(function(km){
      return crypto.subtle.deriveKey({name:"PBKDF2",salt:ct.subarray(0,16),iterations:ROUNDS,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
    }).then(function(key){
      return crypto.subtle.decrypt({name:"AES-GCM",iv:ct.subarray(16,28)},key,ct.subarray(28)).catch(function(){ throw new Error("bad code"); });
    }).then(function(gz){ bar.style.width="90%"; msg.textContent="Opening"; return gunzip(gz); }).then(function(buf){
      var html=new TextDecoder().decode(buf);
      bar.style.width="95%"; msg.textContent="Opening the NCM key";
      return unlockNcm(v).then(function(){ bar.style.width="100%"; openIn(html, chosenView()); });
    }).catch(function(e){
      busy=false; bar.style.width="0";
      if(String(e.message)==="bad code"){ tries++; try{ inp.select(); }catch(x){} msg.textContent="Access code not recognised. Tick Show the code and check it."; wait=Date.now()+Math.min(30000,1500*tries); }
      else { msg.textContent=String(e.message||e); }
    });
  });
})();
</script></body></html>
