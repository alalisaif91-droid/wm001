# WM004 clock (the owner, 1 Nov 2026: every 30 minutes, and the team starts on it). GitHub's own schedule fired about 1 time in 10 on the feed, so the reader and the feed cannot rest on it.
# This job waits in the environment wm004-wait, whose wait timer of 28 minutes holds no runner, then starts itself again, the NCM reader, the rain feed and the site keeper. A tick takes about 3 minutes, so a read comes about every 31 minutes.
# The reader and the feed start 100 seconds apart: two commits seconds apart made the last Pages deploy fail, and the site stayed an hour behind main on 1 Nov 2026. The site keeper (wm004-site.yml) repairs any deploy that still fails.
# 2 Nov 2026: the live job (wm004-engine.yml) starts after the feed: it reads the complaints and the pumps and stands in for the laptop's weather engine when that has stopped.
# The next tick starts first, so a fault later in this job cannot break the chain.
# No outside service and no token: the workflow token may start a workflow_dispatch. The concurrency group keeps one tick running and at most one waiting, so the ticks cannot multiply.
# The schedule below only restarts the chain if a tick ever fails. To stop the clock: disable this workflow in the Actions tab, or delete this file.
name: WM004 clock
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wm004-clock.yml'
  schedule:
    - cron: '11 */3 * * *'
permissions:
  actions: write
concurrency:
  group: wm004-clock
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    environment: wm004-wait
    timeout-minutes: 7
    steps:
      - name: Start the next tick
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run wm004-clock.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Start the reader, the feed and the site keeper
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run wm004-ncm.yml --repo "$GITHUB_REPOSITORY" --ref main || echo "the reader did not start"
          sleep 100
          gh workflow run wm004-feed.yml --repo "$GITHUB_REPOSITORY" --ref main || echo "the feed did not start"
          sleep 75
          gh workflow run wm004-engine.yml --repo "$GITHUB_REPOSITORY" --ref main || echo "the live job did not start"
          sleep 150
          gh workflow run wm004-site.yml --repo "$GITHUB_REPOSITORY" --ref main || echo "the site keeper did not start"
