# WM004 site keeper (1 Nov 2026). GitHub Pages refuses a deploy that lands on another one, and when the reader's commit and the feed's commit arrive seconds apart the last deploy can fail: on 1 Nov 2026 the 08:13 and 08:39 UTC cycles left the live site an hour behind main.
# The clock starts this job after the reader and the feed. It looks at the Pages deploy of the newest gh-pages commit. If that deploy ended in anything but success, it adds one commit holding main's tree, which starts a clean deploy. A lone deploy passed at 08:47 UTC the same day.
# One try per failure: a commit this job made is never followed by another from this job, so a Pages fault cannot start a loop. The next commit from the reader or the feed starts the count again.
# A push of this file forces one deploy, which proves the path each time the file changes.
name: WM004 site keeper
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wm004-site.yml'
permissions:
  actions: read
  contents: write
concurrency:
  group: wm004-site
  cancel-in-progress: false
jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Deploy again if the last Pages deploy failed
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event_name == 'push' }}
        run: |
          R="$GITHUB_REPOSITORY"
          HEAD=$(gh api "repos/$R/commits/gh-pages" --jq .sha)
          WHAT=$(gh api "repos/$R/commits/gh-pages" --jq .commit.message)
          S="not seen"
          for i in 1 2 3 4 5 6 7 8; do
            S=$(gh api "repos/$R/actions/runs?head_sha=$HEAD&per_page=10" --jq '[.workflow_runs[] | select(.name == "pages build and deployment")][0] | "\(.status) \(.conclusion)"')
            case "$S" in completed*) break ;; esac
            sleep 10
          done
          echo "gh-pages $HEAD: $S"
          if [ "$FORCE" != "true" ]; then
            case "$S" in
              "completed success") echo "the site holds the newest commit"; exit 0 ;;
              completed*) ;;
              *) echo "no verdict yet, the next tick looks again"; exit 0 ;;
            esac
            case "$WHAT" in
              "wm004: deploy the site again"*) echo "PAGES DEPLOY FAILED TWICE: the site still shows the last deploy"; exit 1 ;;
            esac
          fi
          TREE=$(gh api "repos/$R/commits/main" --jq .commit.tree.sha)
          C=$(gh api -X POST "repos/$R/git/commits" -f message="wm004: deploy the site again, the last deploy ended $S (GitHub Actions)" -f tree="$TREE" -f "parents[]=$HEAD" --jq .sha)
          gh api -X PATCH "repos/$R/git/refs/heads/gh-pages" -f sha="$C" --silent
          echo "gh-pages moved to $C"
