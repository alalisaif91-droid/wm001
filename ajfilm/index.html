<style>:root{--sans:Calibri,Carlito,"Segoe UI",Arial,sans-serif;--ground:#0E1318;--panel:#151C23;--line:#26323D;--ink:#EEF1F3;--soft:#A3B0BB;--gold:#D9B45A}

<div id="g"><form autocomplete="off"><h1>Al Jazeera Landfill</h1><div class="ar" lang="ar" dir="rtl">مطمر الجزيرة</div>
<p>Enter the access code to open the film and the brief.<br><span lang="ar" dir="rtl">أدخل رمز الدخول لفتح الفيلم والملخص.</span></p>
<input id="c" type="text" maxlength="96" aria-label="Access code" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
<button type="submit">Open · فتح</button><div class="m" id="m" aria-live="polite"></div><div class="bar"><i id="b"></i></div></form></div>
<script>(function(){var R=1000000,f=document.querySelector("form"),c=document.getElementById("c"),m=document.getElementById("m"),b=document.getElementById("b"),busy=false,wait=0,n=0;
