<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>RAKEZ and PSD Client Awareness Session</title>
<style>
  :root { --navy: #13294B; --ink: #1F2F4A; --gold: #C9A227; --bg: #F3F5F8; --card: #FFFFFF; --rule: #D3DAE3; --grey: #63707A; --sans: Calibri, "Segoe UI", Arial, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  header { background: var(--navy); color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 14px; border-bottom: 3px solid var(--gold); }
  header .logo { background: #fff; border-radius: 8px; padding: 5px 7px; line-height: 0; }
  header .logo img { height: 40px; }
  header h1 { font-size: 20px; margin: 0; font-weight: 700; letter-spacing: .2px; }
  header p { margin: 2px 0 0; font-size: 13px; color: #D9E2EC; }
  main { max-width: 1180px; margin: 0 auto; padding: 18px 16px 40px; }
  .gate { max-width: 420px; margin: 9vh auto 0; background: var(--card); border: 1px solid var(--rule); border-top: 4px solid var(--gold); border-radius: 10px; padding: 26px 24px; box-shadow: 0 10px 30px rgba(19,41,75,.08); }
  .gate h2 { margin: 0 0 6px; font-size: 20px; color: var(--navy); }
  .gate p { margin: 0 0 16px; color: var(--grey); font-size: 15px; }
  .gate input { width: 100%; font: 22px var(--sans); letter-spacing: 3px; padding: 11px 12px; border: 1px solid var(--rule); border-radius: 8px; text-align: center; color: var(--navy); }
  .gate input:focus { outline: 2px solid var(--gold); border-color: var(--gold); }
  button { font: 600 15px var(--sans); border: 0; border-radius: 8px; padding: 11px 16px; background: var(--navy); color: #fff; cursor: pointer; }
  button:disabled { opacity: .55; cursor: default; }
  button.ghost { background: #fff; color: var(--navy); border: 1px solid var(--rule); }
  .gate button { width: 100%; margin-top: 12px; }
  .msg { min-height: 20px; margin-top: 10px; font-size: 14px; color: #7A1F1F; text-align: center; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .tabs button { background: #fff; color: var(--navy); border: 1px solid var(--rule); }
  .tabs button.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  .panel { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 14px; }
  .stage { position: relative; background: #0D1B33; border-radius: 6px; overflow: hidden; aspect-ratio: 16 / 9; display: flex; align-items: center; justify-content: center; }
  .stage img, .stage video { width: 100%; height: 100%; object-fit: contain; display: block; background: #0D1B33; }
  .stage .wait { position: absolute; color: #D9E2EC; font-size: 15px; text-align: center; padding: 0 20px; }
  .bar { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .bar input[type=range] { flex: 1; min-width: 140px; accent-color: var(--navy); }
  .count { min-width: 74px; text-align: center; font-weight: 700; color: var(--navy); }
  .spacer { flex: 1; }
  .hide { display: none !important; }
  footer { text-align: center; color: var(--grey); font-size: 13px; padding: 0 16px 28px; }
</style>
</head>

<main>
  <section id="gate" class="gate">
    <h2>Enter the passcode</h2>
    <p>The presentation and the film open with the passcode you were given.</p>
    <form id="gf"><input id="code" inputmode="numeric" autocomplete="off" aria-label="Passcode" autofocus><button id="go" type="submit">Open</button></form>
    <div id="gmsg" class="msg" role="alert"></div>
  </section>
  <section id="app" class="hide">
    <div class="tabs"><button id="tp" class="on" type="button">Presentation</button><button id="tv" type="button">Film</button></div>
    <div id="pp" class="panel">
      <div id="jump" class="bar" style="margin:0 0 12px"><span class="count" style="min-width:0">Go to</span></div>
      <div class="stage"><img id="slide" alt="Slide"><div id="swait" class="wait">Opening the slide</div></div>
      <div class="bar"><button id="prev" class="ghost" type="button">Previous</button><span id="count" class="count"></span><button id="next" class="ghost" type="button">Next</button>
        <input id="seek" type="range" min="1" value="1" aria-label="Slide number"><button id="dld" type="button">Download the PowerPoint</button></div>
    </div>
    <div id="vp" class="panel hide">
      <div class="stage"><video id="film" controls playsinline class="hide"></video><div id="vwait" class="wait">Open the film to load it</div></div>
      <div class="bar"><button id="vload" type="button">Play the film</button><span class="spacer"></span><button id="dlf" class="ghost" type="button" disabled>Download the film</button></div>
    </div>
  </section>
</main>

<script>
(function () {
  "use strict";
  var SALT = Uint8Array.from(atob("73H/LG2FESd2sYRRLViPnw=="), function (c) { return c.charCodeAt(0); }), ROUNDS = 1000000;
  var KEY = null, M = null, cur = 1, cache = {}, filmUrl = null, filmBlob = null;
  var $ = function (id) { return document.getElementById(id); };
  function keyFrom(code) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]).then(function (km) {
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: SALT, iterations: ROUNDS, hash: "SHA-256" }, km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]); });
  }
  function fetchBytes(name, onPart) {
    return fetch(name, { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("file " + r.status);
      if (!onPart || !r.body) return r.arrayBuffer();
      var total = +r.headers.get("Content-Length") || 0, got = 0, parts = [], rd = r.body.getReader();
      function pump() { return rd.read().then(function (x) { if (x.done) return new Blob(parts).arrayBuffer(); parts.push(x.value); got += x.value.length; onPart(got, total); return pump(); }); }
      return pump(); });
  }
  function open(name, onPart) {
    return fetchBytes(name, onPart).then(function (b) { var u = new Uint8Array(b); return crypto.subtle.decrypt({ name: "AES-GCM", iv: u.subarray(0, 12) }, KEY, u.subarray(12)); });
  }
  function slideUrl(n) {
    if (!cache[n]) cache[n] = open("s/" + String(n).padStart(2, "0") + ".bin").then(function (b) { return URL.createObjectURL(new Blob([b], { type: "image/jpeg" })); });
    return cache[n];
  }
  function show(n) {
    cur = Math.max(1, Math.min(M.slides, n)); $("count").textContent = cur + " of " + M.slides; $("seek").value = cur; $("swait").classList.remove("hide");
    var want = cur;

      .catch(function () { $("swait").textContent = "The slide could not be opened. Check the connection and try again."; delete cache[want]; });
  }
  function save(blob, name) { var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 4000); }
  function loadFilm() {
    if (filmUrl) return Promise.resolve();

      filmBlob = new Blob([b], { type: "video/mp4" }); filmUrl = URL.createObjectURL(filmBlob);
      var v = $("film"); v.src = filmUrl; v.classList.remove("hide"); $("vwait").classList.add("hide"); $("vload").classList.add("hide"); $("dlf").disabled = false; v.play().catch(function () {});
    }).catch(function () { $("vwait").textContent = "The film could not be loaded. Check the connection and try again."; $("vload").disabled = false; });
  }
  function tab(which) { var p = which === "p"; $("pp").classList.toggle("hide", !p); $("vp").classList.toggle("hide", p); $("tp").classList.toggle("on", p); $("tv").classList.toggle("on", !p); if (p) $("film").pause(); }
  $("gf").addEventListener("submit", function (e) {
    e.preventDefault();
    var code = $("code").value.replace(/\s+/g, ""); if (!code) return;
    $("go").disabled = true; $("gmsg").style.color = "#63707A"; $("gmsg").textContent = "Checking";
    keyFrom(code).then(function (k) { KEY = k; return open("m.bin"); }).then(function (b) {

    }).catch(function () { KEY = null; $("go").disabled = false; $("gmsg").style.color = "#7A1F1F"; $("gmsg").textContent = "The passcode is not correct."; $("code").select(); });
  });
  $("prev").onclick = function () { show(cur - 1); }; $("next").onclick = function () { show(cur + 1); };
  $("seek").oninput = function () { show(+this.value); };
  $("tp").onclick = function () { tab("p"); }; $("tv").onclick = function () { tab("v"); };
